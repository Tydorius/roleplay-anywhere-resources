<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #dddbd3;
  --accent: #2f6f5e; --accent-ink: #ffffff; --warn: #a2541a; --bad: #b3261e; --chip: #ecebe5;
  --check-a: #e6e4dd; --check-b: #f7f6f2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715; --panel: #20211f; --ink: #ecebe6; --muted: #9c9b94; --line: #353632;
    --accent: #6fbfa6; --accent-ink: #0f1a16; --warn: #e3a36a; --bad: #f08b80; --chip: #2a2b28;
    --check-a: #2a2b28; --check-b: #333430;
  }
}
:root[data-theme="dark"] {
  --bg: #161715; --panel: #20211f; --ink: #ecebe6; --muted: #9c9b94; --line: #353632;
  --accent: #6fbfa6; --accent-ink: #0f1a16; --warn: #e3a36a; --bad: #f08b80; --chip: #2a2b28;
  --check-a: #2a2b28; --check-b: #333430;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; max-width: 1600px; margin: 0 auto; }
h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .01em; }
label.inline { display: flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; max-width: 100%; }
label.inline select, label.inline input[type=text] { min-width: 0; max-width: 100%; flex: 0 1 auto; }
input[type=text], input[type=search], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0;
}
textarea { width: 100%; resize: vertical; min-height: 64px; }
a.button, button { font: inherit; text-decoration: none; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
a.button:hover, button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
[hidden] { display: none !important; }
button:disabled { opacity: .45; cursor: default; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--accent); } .dot.bad { background: var(--bad); }
main { max-width: 1600px; margin: 0 auto; padding: 14px 16px 60px; }
details.models { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
details.models > summary { cursor: pointer; font-weight: 600; }
.models-grid { display: grid; grid-template-columns: 110px minmax(140px, 220px) minmax(180px, 1fr); gap: 8px 12px; align-items: start; margin-top: 12px; }
.models-grid .k { font-weight: 600; padding-top: 6px; }
.models-grid select { width: 100%; }
.roles { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.roles select { font-size: 12px; padding: 3px 6px; }
.note { font-size: 12px; color: var(--muted); margin-top: 3px; }
.note.warn { color: var(--warn); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chip { border-radius: 999px; padding: 4px 12px; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.spacer { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.thumb { position: relative; aspect-ratio: 1; background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 18px 18px; display: grid; place-items: center; }
.thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.thumb .empty { color: var(--muted); font-size: 12px; }
.thumb .pick { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; accent-color: var(--accent); }
.thumb .tag { position: absolute; top: 6px; right: 6px; font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.thumb .old { position: absolute; bottom: 6px; left: 6px; width: 34%; border: 2px solid var(--panel); border-radius: 6px; background: var(--check-b); }
.thumb .busy { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--panel) 65%, transparent); font-weight: 600; }
.body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.err { font-size: 12px; color: var(--bad); word-break: break-word; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.actions button { padding: 4px 9px; font-size: 13px; }
.edit { display: flex; flex-direction: column; gap: 6px; }
.edit select { font-size: 12px; }
.edit .custom { display: flex; flex-direction: column; gap: 6px; }
.edit .custom textarea.prompt { min-height: 120px; }
.edit .hint { font-size: 11px; color: var(--muted); }
.meta { font-size: 11px; color: var(--muted); word-break: break-word; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.hint { color: var(--muted); font-size: 13px; }
.thumb.drop { outline: 3px dashed var(--accent); outline-offset: -6px; }
dialog.crop { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); }
dialog.crop::backdrop { background: rgba(0,0,0,.5); }
.crop-head { padding: 14px 18px 4px; }
.crop-head h3 { margin: 0 0 2px; font-size: 16px; }
.crop-main { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; padding: 8px 18px; }
.crop-stage { position: relative; background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 18px 18px;
  border-radius: 8px; overflow: hidden; touch-action: none; }
.crop-stage canvas { display: block; width: 100%; height: auto; cursor: move; }
.crop-side { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.crop-side .out { width: 100%; border-radius: 8px; border: 1px solid var(--line);
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 14px 14px; }
.crop-side label { display: flex; gap: 6px; align-items: center; }
.crop-side input[type=range] { width: 100%; }
.crop-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
@media (max-width: 640px) { .crop-main { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .models-grid { grid-template-columns: 1fr; }
  .models-grid .k { padding-top: 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Image Gallery</h1>
    <label class="inline">ComfyUI <input type="text" id="comfy" size="24" spellcheck="false"></label>
    <button id="connect">Connect</button>
    <span class="dot" id="dot" title="not connected"></span>
    <label class="inline">Scenario <select id="source"></select></label>
    <button id="reload" title="Re-read the images from disk">Reload</button>
    <button id="openZip" title="Open a scenario zip as a workspace the game won't touch">Open zip…</button>
    <input type="file" id="zipFile" accept=".zip" hidden>
    <button id="toWork" title="Copy this scenario and its images into a workspace, so starting another New Game can't wipe them">Copy to workspace</button>
    <a id="download" class="button" title="Download this workspace as a zip for New Game → Import">Download zip</a>
  </div>
</header>
<main>
  <details class="models" id="models" open>
    <summary>Models per image type</summary>
    <div class="models-grid" id="modelsGrid"></div>
    <div class="models-grid" style="margin-top:14px">
      <div class="k">Cutouts</div>
      <div><select id="remover"></select></div>
      <div class="note">Background remover for map objects and items, which need a transparent background.</div>
    </div>
  </details>

  <div class="toolbar">
    <span id="chips"></span>
    <input type="search" id="search" placeholder="Search names and descriptions">
    <label class="inline"><input type="checkbox" id="missingOnly"> Missing only</label>
    <label class="inline" title="Only new images waiting for Keep or Discard"><input type="checkbox" id="reviewOnly"> Needs review <span id="reviewCount"></span></label>
    <span class="spacer"></span>
    <span class="hint" id="queueInfo"></span>
    <button id="selAll">Select shown</button>
    <button id="selNone">Clear</button>
    <label class="inline" title="Save each new image as soon as it finishes, without reviewing it"><input type="checkbox" id="autoKeep"> Keep automatically</label>
    <button id="keepAll" hidden>Keep all ready</button>
    <button id="regenSel" class="primary" disabled>Regenerate selected</button>
  </div>
  <p class="hint" id="emptyHint"></p>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="imgFile" accept="image/*" hidden>
<dialog class="crop" id="crop"></dialog>

<script>
const KIND_LABEL = {sprite: "Map objects", item: "Items", perk: "Perks", portrait: "Portraits"};
const PROFILE_LABEL = {...KIND_LABEL, portrait: "People", creature: "Creatures"};
const SUBJECT_LABEL = {auto: "Subject: automatic", woman: "One woman", man: "One man", girl: "One girl", boy: "One boy",
  person: "One person", creature: "One creature", spirit: "A spirit or light", none: "No subject words", custom: "Custom prompt…"};
const S = {settings: null, sources: [], kinds: [], subjects: [], menu: null, items: [], fmt: "",
           filter: "all", selected: new Set(), jobs: [], comfyQueue: null, pollError: null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("Content-Type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || body || r.statusText);
  return body;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3500);
}
const source = () => $("source").value;
const remember = (k, v) => { try { localStorage.setItem("gallery." + k, v); } catch {} };
const recall = k => { try { return localStorage.getItem("gallery." + k); } catch { return null; } };

// ---------------------------------------------------------------- settings / models
async function saveSettings() {
  S.settings = await api("/api/settings", {method: "POST", body: JSON.stringify(S.settings)});
}

async function connect(refresh) {
  $("dot").className = "dot"; $("dot").title = "connecting";
  try {
    S.menu = await api("/api/models" + (refresh ? "?refresh=1" : ""));
    $("dot").className = "dot ok"; $("dot").title = "connected";
  } catch (e) {
    S.menu = null; $("dot").className = "dot bad"; $("dot").title = e.message;
    toast(e.message);
  }
  renderModels();
}

function famFiles(kind) {
  const cfg = S.settings.kinds[kind];
  const fam = S.menu?.families[cfg.family];
  const out = {};
  if (fam) for (const r of fam.roles) out[r.role] = cfg.files[r.role] || r.detected;
  return out;
}

function renderModels() {
  const g = $("modelsGrid"); g.innerHTML = "";
  for (const kind of S.profiles) {  // "creature": portraits of animals and monsters, with their own model
    const cfg = S.settings.kinds[kind];
    const fams = S.menu ? Object.entries(S.menu.families).filter(([, f]) => f.kinds.includes(kind === "creature" ? "portrait" : kind)) : [];
    const famSel = document.createElement("select");
    famSel.innerHTML = fams.length
      ? fams.map(([k, f]) => `<option value="${k}" ${k === cfg.family ? "selected" : ""}>${esc(f.title)}${f.missing.length ? " (files missing)" : ""}</option>`).join("")
      : `<option>${esc(cfg.family)}</option>`;
    famSel.onchange = async () => { cfg.family = famSel.value; cfg.files = {}; await saveSettings(); renderModels(); };

    const right = document.createElement("div");
    const fam = S.menu?.families[cfg.family];
    if (fam) {
      const files = famFiles(kind);
      const [main, ...rest] = fam.roles;
      const roleSelect = r => {
        const sel = document.createElement("select");
        const opts = r.options.includes(files[r.role]) ? r.options : [files[r.role], ...r.options];
        sel.innerHTML = opts.map((n, i) => `<option ${n === files[r.role] ? "selected" : ""}>${esc(n)}</option>`
          + (i === r.matches - 1 && r.matches < opts.length ? `<option disabled>──────────</option>` : "")).join("");
        sel.onchange = async () => { cfg.files[r.role] = sel.value; await saveSettings(); };
        return sel;
      };
      right.append(roleSelect(main));
      const missing = fam.missing.filter(r => !cfg.files[r]);
      const note = document.createElement("div");
      note.className = "note" + (missing.length || !fam.loaderInstalled ? " warn" : "");
      note.textContent = !fam.loaderInstalled ? "This ComfyUI lacks a loader node this family needs."
        : missing.length ? `Not found on this ComfyUI: ${missing.join(", ")}. Pick a file or install it (${missing.map(r => fam.roles.find(x => x.role === r).folder).join(", ")}).`
        : fam.summary;
      right.append(note);
      if (rest.length) {
        const d = document.createElement("details");
        d.innerHTML = `<summary class="note">Encoders and VAE</summary>`;
        const roles = document.createElement("div"); roles.className = "roles";
        for (const r of rest) { const l = document.createElement("span"); l.textContent = r.role; roles.append(l, roleSelect(r)); }
        d.append(roles); right.append(d);
      }
    } else {
      right.innerHTML = `<div class="note">Connect to ComfyUI to list models.</div>`;
    }
    const label = document.createElement("div"); label.className = "k"; label.textContent = PROFILE_LABEL[kind];
    const mid = document.createElement("div"); mid.append(famSel);
    g.append(label, mid, right);
  }
  const rm = $("remover");
  const avail = S.menu?.removers || {};
  rm.innerHTML = ["auto", "rembg", "ben2", "none"].map(k => {
    const t = k === "auto" ? `Automatic${S.menu ? " (" + S.menu.autoRemover + ")" : ""}` : k === "none" ? "None (keep white background)"
      : k + (S.menu && !avail[k] ? " (not installed)" : "");
    return `<option value="${k}" ${k === S.settings.remover ? "selected" : ""}>${esc(t)}</option>`;
  }).join("");
}

// ---------------------------------------------------------------- items
async function loadItems() {
  const src = source();
  if (!src) { S.items = []; renderGrid(); return; }
  const r = await api("/api/items?source=" + encodeURIComponent(src));
  const old = Object.fromEntries(S.items.map(i => [i.id, i]));
  S.items = r.items.map(i => ({...i, job: old[i.id]?.job, error: old[i.id]?.error,
                               editing: old[i.id]?.editing, editDesc: old[i.id]?.editDesc, subjectSel: old[i.id]?.subjectSel}));
  S.fmt = r.promptFormat;
  renderChips(); renderGrid();
  try {  // results finished while the gallery or this page was closed
    const {added} = await api("/api/adopt?source=" + encodeURIComponent(src), {method: "POST"});
    if (added) toast(`Found ${added} finished image${added > 1 ? "s" : ""} on ComfyUI to review.`);
  } catch (e) { toast(e.message); }
  schedulePoll(0);
}

function matches(i) {
  const q = $("search").value.trim().toLowerCase();
  return (S.filter === "all" || i.kind === S.filter)
    && (!$("missingOnly").checked || !i.file)
    && (!$("reviewOnly").checked || i.job?.state === "done")
    && (!q || i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q));
}
const shown = () => S.items.filter(matches);

function renderChips() {
  const counts = {all: S.items.length};
  for (const i of S.items) counts[i.kind] = (counts[i.kind] || 0) + 1;
  $("chips").innerHTML = ["all", ...S.kinds].map(k =>
    `<button class="chip ${S.filter === k ? "on" : ""}" data-k="${k}">${k === "all" ? "All" : KIND_LABEL[k]} <span>${counts[k] || 0}</span></button>`).join(" ");
  for (const b of $("chips").querySelectorAll("button")) b.onclick = () => { S.filter = b.dataset.k; renderChips(); renderGrid(); };
}

function renderGrid() {
  const list = shown();
  $("grid").innerHTML = "";
  for (const it of list) $("grid").append(card(it));
  $("emptyHint").textContent = !S.sources.length ? "No scenario found. Start a New Game in Anywhere RPG (or load a save), or open a scenario zip."
    : list.length ? "" : "Nothing matches.";
  updateBar();
}

const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const active = j => j && (j.state === "pending" || j.state === "running");

function updateBar() {
  $("regenSel").disabled = !S.selected.size;
  $("regenSel").textContent = S.selected.size ? `Regenerate selected (${S.selected.size})` : "Regenerate selected";
  const mine = S.jobs.filter(j => j.source === source());
  const n = st => mine.filter(j => j.state === st).length;
  const run = n("running"), wait = n("pending");
  const ready = S.items.filter(i => i.job?.state === "done").length;  // current right after a Keep, before the next poll
  const cq = S.comfyQueue || {};
  const total = (cq.running || 0) + (cq.pending || 0);
  $("queueInfo").textContent = S.pollError || [
    run && `${run} generating`, wait && `${wait} waiting`,
    total > run + wait && `ComfyUI queue ${total} in all`].filter(Boolean).join(" · ");
  $("keepAll").hidden = !ready;
  $("reviewCount").textContent = ready ? `(${ready})` : "";
  $("keepAll").textContent = `Keep all ready (${ready})`;
}

function thumbUrl(it) {
  return `/media?source=${encodeURIComponent(source())}&id=${encodeURIComponent(it.id)}&file=${encodeURIComponent(it.file)}&v=${it.mtime}`;
}
const resultUrl = job => `/api/result?pid=${encodeURIComponent(job.pid)}`;

function card(it) {
  const el = document.createElement("div");
  el.className = "card" + (S.selected.has(it.id) ? " sel" : "");
  el.id = "c-" + it.id;
  const job = it.job, st = job?.state;
  const cur = it.file ? `<img loading="lazy" src="${thumbUrl(it)}" alt="">` : `<span class="empty">No image yet</span>`;
  const main = st === "done" ? `<img src="${resultUrl(job)}" alt="">${it.file ? `<img class="old" src="${thumbUrl(it)}" alt="" title="current image">` : ""}` : cur;
  const busy = it.sending ? `<div class="busy">Sending…</div>`
    : st === "pending" ? `<div class="busy">${job.position ? `Waiting in ComfyUI: #${job.position}` : "Sent to ComfyUI"}</div>`
    : st === "running" ? `<div class="busy">Generating… ${clock(job.elapsed)}</div>` : "";
  const error = it.error || (st === "error" ? job.error : "");
  el.innerHTML = `
    <div class="thumb">${main}${busy}
      <input type="checkbox" class="pick" ${S.selected.has(it.id) ? "checked" : ""} title="Select">
      <span class="tag">${KIND_LABEL[it.kind].replace(/s$/, "").replace("Map object", "Object")}</span></div>
    <div class="body">
      <div class="name" title="${esc(it.name)}">${esc(it.name)}</div>
      <div class="desc" title="${esc(it.desc)}">${esc(it.editDesc ?? it.desc)}</div>
      ${error ? `<div class="err">${esc(error)}</div>` : ""}
      ${st === "done" ? `<div class="meta">${job.meta.width}×${job.meta.height}, ${clock(job.elapsed)}, ${esc(Object.values(job.meta.files)[0])}</div>` : ""}
      ${it.editing ? `<div class="edit">
          <textarea class="desc-edit" spellcheck="true" title="Description used for this image only; the scenario is not changed">${esc(it.editDesc ?? it.desc)}</textarea>
          ${it.kind === "portrait" ? `<select class="subject">${S.subjects.map(s => `<option value="${s}" ${s === (it.subjectSel || "auto") ? "selected" : ""}>${
            esc(s === "auto" ? `${SUBJECT_LABEL.auto} (${it.subject})` : SUBJECT_LABEL[s])}</option>`).join("")}</select>` : ""}
          ${it.subjectSel === "custom" ? `<div class="custom">
            <select class="from"><option value="">Start from…</option>${S.subjects.filter(s => s !== "custom").map(s =>
              `<option value="${s}">${esc(s === "auto" ? `${SUBJECT_LABEL.auto} (${it.subject})` : SUBJECT_LABEL[s])}</option>`).join("")}</select>
            <textarea class="prompt" spellcheck="true" placeholder="The whole prompt. \${DESC} is replaced by the description above.">${esc(it.customPrompt ?? "")}</textarea>
            <textarea class="neg" spellcheck="false" placeholder="Added to the negative prompt (SDXL and SD1.5 only)">${esc(it.customNegative ?? "")}</textarea>
            <div class="hint">\${DESC} is replaced by the description above. The last custom prompt you write is offered on the next card.</div>
          </div>` : ""}
        </div>` : ""}
      <div class="actions">
        ${st === "done"
          ? `<button class="primary" data-a="keep">Keep</button><button data-a="regen">Retry</button><button data-a="forget">Discard</button>`
          : active(job) ? `<button class="danger" data-a="cancel">Cancel</button>`
          : `<button class="primary" data-a="regen" ${it.sending ? "disabled" : ""}>${it.file ? "Regenerate" : "Generate"}</button>
             <button data-a="browse" title="Use an image of your own (or drop one on the picture)">Browse…</button>
             <button data-a="edit">${it.editing ? "Done" : "Edit prompt"}</button>
             ${st === "error" ? `<button data-a="forget">Dismiss</button>` : ""}
             ${it.file ? `<button class="danger" data-a="delete" title="Delete; the game draws a new one when it next loads">Delete</button>` : ""}`}
      </div>
    </div>`;
  el.querySelector(".pick").onchange = e => { e.target.checked ? S.selected.add(it.id) : S.selected.delete(it.id); el.classList.toggle("sel", e.target.checked); updateBar(); };
  const ta = el.querySelector(".desc-edit"); if (ta) ta.oninput = () => { it.editDesc = ta.value; };
  const sub = el.querySelector(".edit .subject"); if (sub) sub.onchange = () => {
    it.subjectSel = sub.value;
    if (sub.value === "custom" && it.customPrompt == null) {  // start from the last custom prompt, or this card's own
      const last = recall("customPrompt");
      if (last) { it.customPrompt = last; it.customNegative = recall("customNegative") || ""; }
      else return fillCustom(it, "auto");
    }
    redraw(it);
  };
  const from = el.querySelector(".custom .from"); if (from) from.onchange = () => from.value && fillCustom(it, from.value);
  const cp = el.querySelector(".custom .prompt"); if (cp) cp.oninput = () => { it.customPrompt = cp.value; remember("customPrompt", cp.value); };
  const cn = el.querySelector(".custom .neg"); if (cn) cn.oninput = () => { it.customNegative = cn.value; remember("customNegative", cn.value); };
  for (const b of el.querySelectorAll("[data-a]")) b.onclick = () => act(it, b.dataset.a);
  const th = el.querySelector(".thumb");
  th.ondragover = e => { if (!active(it.job) && [...e.dataTransfer.items].some(x => x.kind === "file")) { e.preventDefault(); th.classList.add("drop"); } };
  th.ondragleave = () => th.classList.remove("drop");
  th.ondrop = e => { e.preventDefault(); th.classList.remove("drop"); const f = e.dataTransfer.files[0]; if (f) openCrop(it, f); };
  return el;
}

function redraw(it) {  // a card that now passes or fails the filters appears or goes
  const old = document.getElementById("c-" + it.id), want = matches(it);
  if (old && want) old.replaceWith(card(it));
  else if (old) old.remove();
  else if (want) return renderGrid();
  updateBar();
}

async function act(it, a) {
  if (a === "edit") { it.editing = !it.editing; return redraw(it); }
  if (a === "browse") { const inp = $("imgFile"); inp.onchange = () => { const f = inp.files[0]; inp.value = ""; if (f) openCrop(it, f); }; return inp.click(); }
  if (a === "regen") return submit(it);
  if (a === "keep") return keep(it);
  if (a === "forget" || a === "cancel") {
    const pid = it.job.pid;
    it.job = null; it.error = null; redraw(it);
    try { await api(`/api/${a}?pid=${encodeURIComponent(pid)}`, {method: "POST"}); } catch (e) { toast(e.message); }
    return schedulePoll(300);
  }
  if (a === "delete") {
    if (!confirm(`Delete the image for "${it.name}"? A copy goes to gallery-backups/; the game draws a new one when it next loads.`)) return;
    try {
      await api(`/api/delete?source=${encodeURIComponent(source())}&id=${encodeURIComponent(it.id)}&kind=${it.kind}`, {method: "POST"});
      it.file = null; redraw(it); toast("Deleted " + it.name);
    } catch (e) { toast(e.message); }
  }
}

async function fillCustom(it, from) {  // a custom prompt starting from another subject's
  const subject = from === "auto" ? it.subject : from, prof = subject === "creature" ? "creature" : "portrait";
  try {
    const t = await api("/api/template", {method: "POST", body: JSON.stringify({
      family: S.settings.kinds[prof].family, files: famFiles(prof), subject})});
    Object.assign(it, {customPrompt: t.prompt, customNegative: t.negative, customFrom: subject});
    remember("customPrompt", t.prompt); remember("customNegative", t.negative);
  } catch (e) { toast(e.message); }
  redraw(it);
}

// ---------------------------------------------------------------- jobs: queued on ComfyUI, followed by polling
const subjectOf = it => it.subjectSel === "custom" ? it.customFrom : it.subjectSel && it.subjectSel !== "auto" ? it.subjectSel : it.subject;
const profile = it => it.kind === "portrait" && subjectOf(it) === "creature" ? "creature" : it.kind;

async function submit(it) {
  const kind = it.kind, prof = profile(it), cfg = S.settings.kinds[prof];
  it.sending = true; it.error = null; redraw(it);
  try {
    it.job = await api("/api/submit", {method: "POST", body: JSON.stringify({
      source: source(), id: it.id, kind, family: cfg.family, files: famFiles(prof), desc: it.editDesc ?? it.desc,
      aspect: it.aspect, subject: it.subjectSel || "auto", autoSubject: it.subject, promptFormat: S.fmt,
      customPrompt: it.customPrompt, customNegative: it.customNegative})});
  } catch (e) { it.error = e.message; }
  it.sending = false; redraw(it); schedulePoll(500);
}

let pollTimer;
function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

async function poll() {
  try {
    const r = await api("/api/jobs");
    S.jobs = r.jobs; S.comfyQueue = r.comfyQueue; S.pollError = r.error;
    const mine = new Map(r.jobs.filter(j => j.source === source()).map(j => [j.id, j]));
    for (const it of S.items) {
      if (it.sending) continue;
      const j = mine.get(it.id) || null;
      if (JSON.stringify(j) !== JSON.stringify(it.job || null)) { it.job = j; redraw(it); }
    }
  } catch (e) { S.pollError = e.message; }
  updateBar();
  if ($("autoKeep").checked && !S.keeping && S.items.some(i => i.job?.state === "done")) keepReady(true);
  schedulePoll(S.jobs.some(active) ? 2000 : 6000);
}

async function keep(it, quiet) {
  try {
    // createImageBitmap, not <img>.decode(): decode() stalls while the tab is in the background
    const bmp = await createImageBitmap(await (await fetch(resultUrl(it.job))).blob());
    const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
    c.getContext("2d").drawImage(bmp, 0, 0); bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/webp", 0.85));  // the game's own quality
    if (!blob || blob.type !== "image/webp") throw new Error("This browser can't save WebP; open the page in Chrome, Edge or Firefox.");
    await api(`/api/save?source=${encodeURIComponent(source())}&id=${encodeURIComponent(it.id)}&kind=${it.kind}`, {method: "POST", body: blob});
    await api(`/api/forget?pid=${encodeURIComponent(it.job.pid)}`, {method: "POST"});
    it.job = null; it.error = null; it.file = `${it.id}-${it.kind}.webp`; it.mtime = Date.now();
    redraw(it);
    if (!quiet) toast(`Saved ${it.name}. Reload the scenario in the game to see it.`);
    return true;
  } catch (e) { it.error = e.message; redraw(it); return false; }
}

// ---------------------------------------------------------------- your own images: crop, size, save as WebP
// Portraits, items and perks are square, 512 × 512. A map object keeps the aspect the game draws its
// footprint at, (width + 0.5) / (height + 0.5) cells, at up to 1024 px on the long side, and needs a
// transparent background. The result is WebP at the game's quality, saved like a kept ComfyUI image.
const SQUARE = 512, SPRITE_LONG = 1024;

async function openCrop(it, file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }   // not <img>.decode(), which stalls in a background tab
  catch { return toast(`Can't read ${file.name} as an image`); }
  const target = it.kind === "sprite" ? it.aspect : 1;
  const st = {bmp, target, mode: it.kind === "sprite" ? "fit" : "crop", box: null, alpha: hasAlpha(bmp)};
  // the largest box of the target aspect inside the picture; a portrait starts at the top (faces are up there)
  const full = bmp.width / bmp.height > target ? {w: bmp.height * target, h: bmp.height} : {w: bmp.width, h: bmp.width / target};
  st.box = {w: full.w, h: full.h, x: (bmp.width - full.w) / 2, y: it.kind === "portrait" ? 0 : (bmp.height - full.h) / 2};
  st.maxW = full.w;
  const off = Math.abs(Math.log((bmp.width / bmp.height) / target)) > Math.log(1.15);
  const warn = [
    it.kind === "sprite" && !st.alpha && "This picture has no transparent background. Map objects are drawn on the ground, so anything that isn't the object will show.",
    it.kind === "sprite" && off && `Its shape (${bmp.width} × ${bmp.height}) is far from this object's footprint; fit leaves empty space, crop cuts some off.`,
    Math.min(bmp.width, bmp.height) < 256 && "It's small, so it will look soft when enlarged.",
  ].filter(Boolean);
  const dlg = $("crop");
  dlg.innerHTML = `<div class="crop-head"><h3>${esc(it.name)}</h3>
      <div class="hint">${esc(KIND_LABEL[it.kind].replace(/s$/, ""))} · ${esc(file.name)} · ${bmp.width} × ${bmp.height}</div></div>
    <div class="crop-main">
      <div class="crop-stage"><canvas id="cropCanvas"></canvas></div>
      <div class="crop-side">
        ${it.kind === "sprite" ? `<label><input type="radio" name="cm" value="fit" checked> Fit the whole picture</label>
          <label><input type="radio" name="cm" value="crop"> Crop to fill</label>` : ""}
        <label id="zoomRow">Size <input type="range" id="cropZoom" min="0.1" max="1" step="0.01" value="1"></label>
        <div class="hint">Drag the frame to choose what's kept.</div>
        <canvas class="out" id="cropOut"></canvas>
        <div class="hint" id="cropSize"></div>
        ${warn.map(w => `<div class="note warn">${esc(w)}</div>`).join("")}
      </div>
    </div>
    <div class="crop-foot"><button id="cropCancel">Cancel</button><button class="primary" id="cropSave">Save</button></div>`;
  const cv = $("cropCanvas"), scale = Math.min(1, 520 / Math.max(bmp.width, bmp.height));
  cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
  const draw = () => {
    const g = cv.getContext("2d");
    g.clearRect(0, 0, cv.width, cv.height); g.drawImage(bmp, 0, 0, cv.width, cv.height);
    $("zoomRow").hidden = st.mode !== "crop";
    if (st.mode === "crop") {
      const b = st.box, x = b.x * scale, y = b.y * scale, w = b.w * scale, h = b.h * scale;
      g.fillStyle = "rgba(0,0,0,.5)";
      g.fillRect(0, 0, cv.width, y); g.fillRect(0, y + h, cv.width, cv.height - y - h);
      g.fillRect(0, y, x, h); g.fillRect(x + w, y, cv.width - x - w, h);
      g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
    }
    const out = render(st);
    const o = $("cropOut"); o.width = out.width; o.height = out.height; o.getContext("2d").drawImage(out, 0, 0);
    $("cropSize").textContent = `Saved as ${out.width} × ${out.height} WebP`;
  };
  const clamp = () => {
    const b = st.box;
    b.x = Math.max(0, Math.min(bmp.width - b.w, b.x)); b.y = Math.max(0, Math.min(bmp.height - b.h, b.y));
  };
  let drag = null;
  cv.onpointerdown = e => { if (st.mode !== "crop") return; cv.setPointerCapture(e.pointerId); drag = {x: e.clientX, y: e.clientY, bx: st.box.x, by: st.box.y}; };
  cv.onpointermove = e => {
    if (!drag) return;
    const k = bmp.width / cv.getBoundingClientRect().width;
    st.box.x = drag.bx + (e.clientX - drag.x) * k; st.box.y = drag.by + (e.clientY - drag.y) * k; clamp(); draw();
  };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  $("cropZoom").oninput = () => {
    const b = st.box, cx = b.x + b.w / 2, cy = b.y + b.h / 2, z = +$("cropZoom").value;
    b.w = st.maxW * z; b.h = b.w / target; b.x = cx - b.w / 2; b.y = it.kind === "portrait" && b.y === 0 ? 0 : cy - b.h / 2; clamp(); draw();
  };
  dlg.querySelectorAll("[name=cm]").forEach(r => r.onchange = () => { st.mode = r.value; draw(); });
  const close = () => { dlg.close(); bmp.close(); };
  $("cropCancel").onclick = close;
  dlg.oncancel = e => { e.preventDefault(); close(); };
  $("cropSave").onclick = async () => {
    $("cropSave").disabled = true;
    try {
      const blob = await new Promise(r => render(st).toBlob(r, "image/webp", 0.85));
      if (!blob || blob.type !== "image/webp") throw new Error("This browser can't save WebP; open the page in Chrome, Edge or Firefox.");
      await api(`/api/save?source=${encodeURIComponent(source())}&id=${encodeURIComponent(it.id)}&kind=${it.kind}`, {method: "POST", body: blob});
      it.file = `${it.id}-${it.kind}.webp`; it.mtime = Date.now(); it.error = null;
      close(); redraw(it); toast(`Saved ${it.name}. Reload the scenario in the game to see it.`);
    } catch (e) { $("cropSave").disabled = false; toast(e.message); }
  };
  dlg.showModal();
  draw();
}

/** The finished image: the crop box scaled to size, or (fit) the whole picture centred on transparency. */
function render(st) {
  const {bmp, target} = st;
  const [w, h] = target === 1 ? [SQUARE, SQUARE]
    : target > 1 ? [SPRITE_LONG, Math.round(SPRITE_LONG / target)] : [Math.round(SPRITE_LONG * target), SPRITE_LONG];
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
  if (st.mode === "fit") {
    const k = Math.min(w / bmp.width, h / bmp.height), dw = bmp.width * k, dh = bmp.height * k;
    g.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
  } else {
    const b = st.box;
    g.drawImage(bmp, b.x, b.y, b.w, b.h, 0, 0, w, h);
  }
  return c;
}

/** Whether any pixel is see-through, checked on a small copy. */
function hasAlpha(bmp) {
  const c = document.createElement("canvas"), k = Math.min(1, 128 / Math.max(bmp.width, bmp.height));
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  return false;
}

// ---------------------------------------------------------------- wiring
$("connect").onclick = async () => { S.settings.comfy = $("comfy").value.trim(); await saveSettings(); connect(true); };
$("remover").onchange = async () => { S.settings.remover = $("remover").value; await saveSettings(); };
$("source").onchange = () => { remember("source", source()); sourceButtons(); S.selected.clear(); S.items = []; loadItems().catch(e => toast(e.message)); };
$("reload").onclick = () => loadItems().catch(e => toast(e.message));
const isWork = () => source().startsWith("work/");
function sourceButtons() {
  $("toWork").hidden = !source() || isWork() || source().startsWith("saves/");
  $("download").hidden = !isWork();
  $("download").href = "/api/export?source=" + encodeURIComponent(source());
}
async function refreshSources(select) {
  const st = await api("/api/state");
  S.sources = st.sources;
  $("source").innerHTML = S.sources.map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("");
  if (select) { $("source").value = select; remember("source", select); }
  sourceButtons();
  S.selected.clear(); S.items = [];
  await loadItems();
}
$("openZip").onclick = () => $("zipFile").click();
$("zipFile").onchange = async () => {
  const f = $("zipFile").files[0];
  $("zipFile").value = "";
  if (!f) return;
  try {
    toast(`Opening ${f.name}…`);
    const r = await api("/api/import", {method: "POST", body: f});
    await refreshSources(r.source);
    toast(`Opened ${f.name} as a workspace. Download zip when you're done, then import it in the game.`);
  } catch (e) { toast(e.message); }
};
$("toWork").onclick = async () => {
  try {
    const r = await api("/api/workspace?source=" + encodeURIComponent(source()), {method: "POST"});
    await refreshSources(r.source);
    toast("Copied into a workspace. Changes here no longer touch the game until you download and import the zip.");
  } catch (e) { toast(e.message); }
};
$("search").oninput = renderGrid;
$("missingOnly").onchange = renderGrid;
$("reviewOnly").onchange = renderGrid;
$("selAll").onclick = () => { for (const i of shown()) S.selected.add(i.id); renderGrid(); };
$("selNone").onclick = () => { S.selected.clear(); renderGrid(); };
$("regenSel").onclick = async () => {
  const picked = S.items.filter(i => S.selected.has(i.id) && !active(i.job) && !i.sending);
  S.selected.clear(); renderGrid();
  for (const i of picked) await submit(i);  // each is queued on ComfyUI at once; ComfyUI runs them in order
};
async function keepReady(auto) {
  S.keeping = true;
  const ready = S.items.filter(i => i.job?.state === "done");
  let saved = 0;
  for (const i of ready) if (await keep(i, true)) saved++;
  S.keeping = false;
  toast(`${auto ? "Kept automatically" : "Saved"}: ${saved} of ${ready.length}. ${isWork() ? "Download the zip to take them to the game." : "Reload the scenario in the game to see them."}`);
}
$("keepAll").onclick = () => { if (!S.keeping) keepReady(false); };
$("autoKeep").checked = recall("autoKeep") === "1";
$("autoKeep").onchange = () => { remember("autoKeep", $("autoKeep").checked ? "1" : "0"); if ($("autoKeep").checked) schedulePoll(0); };

(async () => {
  const st = await api("/api/state");
  Object.assign(S, {settings: st.settings, sources: st.sources, kinds: st.kinds, profiles: st.profiles, subjects: st.subjects});
  $("comfy").value = S.settings.comfy;
  $("source").innerHTML = S.sources.map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("");
  const last = recall("source");
  if (last && S.sources.some(s => s.id === last)) $("source").value = last;
  sourceButtons();
  renderModels();
  await Promise.all([connect(false), loadItems().catch(e => toast(e.message))]);
})();
</script>
</body>
</html>
